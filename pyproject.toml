[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-sentinel"
version = "1.0.0"
description = "Reproducible offline automotive CAN intrusion detection benchmark"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "joblib"]

[project.scripts]
can-sentinel = "can_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["can_sentinel*"]
